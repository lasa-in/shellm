[metadata]
name = shellm
version = 0.1.0
description = Open-source terminal AI assistant with real shell access. Works with OpenAI, Anthropic, Gemini, and local models via Ollama.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
requires-python = >=3.9
keywords = ai, llm, terminal, cli, assistant, shell, agent
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Topic :: Utilities

[options]
packages = find:
install_requires =
    litellm>=1.40.0

[options.entry_points]
console_scripts =
    shellm = shellm.main:main

[options.extras_require]
dev =
    pytest>=7.0
    pytest-mock>=3.10
