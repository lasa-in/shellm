[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "shellm"
version = "0.1.0"
description = "Open-source terminal AI assistant with real shell access. Works with OpenAI, Anthropic, Gemini, and local models via Ollama."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "llm", "terminal", "cli", "assistant", "shell", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "litellm>=1.40.0",
]

[project.scripts]
shellm = "shellm.main:main"

[project.urls]
Homepage = "https://github.com/lasa-in/shellm"
Repository = "https://github.com/lasa-in/shellm"
Issues = "https://github.com/lasa-in/shellm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["shellm*"]
